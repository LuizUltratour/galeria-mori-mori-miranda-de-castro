<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria de Vídeos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Grupo Impper — tema navy imersivo */
      --bg:            #325825;
      --surface:       #3E6330;
      --surface-2:     #4A6E3B;
      --dark:          #FFFFFF;
      --border:        rgba(255,255,255,0.12);
      --border-strong: rgba(255,255,255,0.28);
      --accent:        #E57D43;
      --accent-soft:   rgba(229,125,67,0.16);
      --font-sans:     'Inter', system-ui, sans-serif;
      --ease:          cubic-bezier(0.4, 0, 0.2, 1);
      --spring:        cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--dark);
      font-family: var(--font-sans);
    }

    /* ── ROOT ── */
    #vg-root {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: var(--bg);
    }

    /* ── HEADER ── */
    #vg-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      gap: 12px;
    }

    /* ── TABS ── */
    #vg-tabs {
      display: flex;
      gap: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
    }

    .vg-tab {
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 6px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: transparent;
      color: rgba(255,255,255,0.55);
      transition: background 0.2s var(--ease), color 0.2s var(--ease);
      white-space: nowrap;
    }
    .vg-tab:hover { color: #FFFFFF; }

    .vg-tab.active {
      background: var(--accent);
      color: #FFFFFF;
      box-shadow: 0 3px 12px rgba(229,125,67,0.35);
    }

    #btn-close {
      width: 36px; height: 36px;
      border: 1px solid var(--border-strong);
      background: transparent;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      color: var(--dark);
      transition: background 0.25s var(--ease), color 0.25s var(--ease);
      flex-shrink: 0;
    }
    #btn-close:hover { background: var(--dark); color: var(--bg); border-color: var(--dark); }

    /* ── TAB PANELS ── */
    .tab-panel {
      display: none;
      flex: 1;
      min-height: 0;
    }
    .tab-panel.active { display: flex; flex-direction: column; }

    /* ── HERO (institucional + conceito) ── */
    #tab-institucional,
    #tab-conceito {
      background: #000;
      align-items: center;
      justify-content: center;
    }

    .hero-player {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      outline: none;
    }

    #vg-scroll {
      flex: 1;
      overflow-y: auto;
      scroll-behavior: smooth;
    }
    #vg-scroll::-webkit-scrollbar { width: 5px; }
    #vg-scroll::-webkit-scrollbar-track { background: var(--bg); }
    #vg-scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

    #vg-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 14px;
    }
    @media (max-width: 1100px) { #vg-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 700px)  { #vg-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 420px)  { #vg-grid { grid-template-columns: 1fr; } }

    /* ── VIDEO CARD ── */
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(14px) scale(0.98); filter: blur(4px); }
      to   { opacity: 1; transform: none; filter: blur(0); }
    }

    .vg-card {
      position: relative;
      aspect-ratio: 16/9;
      overflow: hidden;
      cursor: pointer;
      background: #1F3817;
      border-radius: 14px;
      border: 1px solid var(--border);
      box-shadow: 0 6px 20px rgba(0,0,0,0.28);
      animation: cardIn 0.55s var(--spring) both;
      transition: transform 0.4s var(--ease), box-shadow 0.4s var(--ease), border-color 0.4s var(--ease);
    }
    .vg-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent);
      box-shadow: 0 16px 38px rgba(0,0,0,0.42), 0 0 0 1px var(--accent-soft);
    }

    /* placeholder gradient while thumb loads */
    .vg-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #3E6330 0%, #1F3817 100%);
      z-index: 0;
      transition: opacity 0.4s ease;
    }
    .vg-card.thumb-ready::before { opacity: 0; pointer-events: none; }

    .vg-card video {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .vg-play {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.18);
      transition: background 0.25s var(--ease);
    }
    .vg-card:hover .vg-play { background: rgba(0,0,0,0.35); }

    .vg-play-icon {
      width: 52px; height: 52px;
      border-radius: 50%;
      background: var(--accent);
      color: #FFFFFF;
      display: flex; align-items: center; justify-content: center;
      transform: scale(0.85);
      transition: transform 0.3s var(--spring);
      box-shadow: 0 6px 18px rgba(229,125,67,0.45);
      flex-shrink: 0;
    }
    .vg-card:hover .vg-play-icon { transform: scale(1); }
    .vg-play-icon svg { margin-left: 3px; }

    .vg-card-info {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 28px 14px 13px;
      background: linear-gradient(to top, rgba(20,14,9,0.92) 0%, rgba(20,14,9,0.45) 60%, transparent 100%);
      color: #FFFFFF;
    }
    .vg-card-title {
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1.3;
      text-shadow: 0 1px 6px rgba(0,0,0,0.8);
    }
    .vg-card-dur {
      font-size: 9.5px;
      font-weight: 400;
      opacity: 0.7;
      margin-top: 3px;
      letter-spacing: 0.04em;
    }

    /* ── LIGHTBOX ── */
    #vg-lightbox {
      position: fixed;
      inset: 0;
      z-index: 9000;
      display: flex;
      flex-direction: column;
      background: rgba(20,14,9,0.98);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #vg-lightbox.open { opacity: 1; pointer-events: auto; }

    #vl-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 28px;
      flex-shrink: 0;
    }
    #vl-info { display: flex; flex-direction: column; gap: 3px; }
    #vl-title {
      font-size: 14px;
      font-weight: 600;
      color: #FFFFFF;
      letter-spacing: 0.02em;
    }
    #vl-counter {
      font-size: 10px;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.06em;
    }
    #vl-close {
      width: 38px; height: 38px;
      border: 1px solid rgba(255,255,255,0.25);
      background: transparent;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      color: #FFFFFF;
      transition: background 0.22s, border-color 0.22s;
      flex-shrink: 0;
    }
    #vl-close:hover { background: var(--accent); color: #FFFFFF; border-color: var(--accent); }

    #vl-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 60px;
      min-height: 0;
      position: relative;
    }

    #vl-player {
      max-width: 100%;
      max-height: 100%;
      width: 100%;
      outline: none;
      border-radius: 2px;
    }

    .vl-nav {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      width: 46px; height: 46px;
      border: 1px solid rgba(255,255,255,0.18);
      background: transparent;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      color: #FFFFFF;
      transition: background 0.22s, border-color 0.22s;
    }
    .vl-nav:hover { background: var(--accent); border-color: var(--accent); }
    .vl-nav:disabled { opacity: 0.18; cursor: default; }
    #vl-prev { left: 12px; }
    #vl-next { right: 12px; }

    #vl-foot {
      padding: 10px 28px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-shrink: 0;
    }
    #vl-hint {
      font-size: 10px;
      color: rgba(255,255,255,0.25);
      letter-spacing: 0.06em;
    }

    /* ── MOBILE ── */
    @media (max-width: 600px) {
      #vg-header {
        flex-wrap: wrap;
        padding: 10px 14px 8px;
        row-gap: 8px;
      }
      #vg-title { order: 1; flex: 1; }
      #btn-close { order: 2; }
      #vg-tabs   { order: 3; width: 100%; justify-content: center; }
      .vg-tab    { flex: 1; text-align: center; padding: 7px 8px; }

      #vg-grid { gap: 2px; padding: 2px; }
      #vl-head { padding: 12px 14px; }
      #vl-body { padding: 0; }
      #vl-prev { left: 8px; }
      #vl-next { right: 8px; }
      #vl-foot { padding: 8px 14px; }
      .vl-nav  { width: 38px; height: 38px; background: rgba(20,14,9,0.6); border-color: transparent; }
    }

    /* ── ACESSIBILIDADE / DESEMPENHO ── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
      .vg-card { animation: none; filter: none; }
      .vg-card:hover { transform: none; }
    }
  
    #btn-close { border:none !important; border-radius:0 !important; width:60px !important; height:60px !important; background:url(assets/close-normal.png) center/100% 100% no-repeat !important; color:transparent; padding:0; backdrop-filter:none; -webkit-backdrop-filter:none; }
    #btn-close:active { background-image:url(assets/close-hover.png) !important; }
    @media (hover: hover) { #btn-close:hover { background:url(assets/close-hover.png) center/100% 100% no-repeat !important; border:none !important; border-radius:0 !important; width:60px !important; height:60px !important; } }

  </style>
</head>
<body>

<div id="vg-root">
  <header id="vg-header">
    <div id="vg-tabs" role="tablist">
      <button class="vg-tab active" data-tab="institucional" role="tab">Institucional</button>
      <button class="vg-tab"       data-tab="conceito"      role="tab">Conceito</button>
    </div>

    <button id="btn-close" title="Fechar" aria-label="Fechar"></button>
  </header>

  <!-- Tab: Institucional -->
  <div id="tab-institucional" class="tab-panel active" role="tabpanel">
    <video class="hero-player" data-tab="institucional"
           src="assets/videos/legacy-video-3.mp4"
           autoplay muted playsinline controls
           preload="auto">
    </video>
  </div>

  <!-- Tab: Conceito -->
  <div id="tab-conceito" class="tab-panel" role="tabpanel">
    <video class="hero-player" data-tab="conceito"
           src="assets/videos/conceito-01.mp4"
           muted playsinline controls
           preload="metadata">
    </video>
  </div>
</div>

<script>
// ── abas: dois vídeos hero (Institucional + Conceito) ───────────
const heroes = Array.from(document.querySelectorAll('.hero-player'));
const heroFor = tab => heroes.find(v => v.dataset.tab === tab);

document.querySelectorAll('.vg-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    const tab = btn.dataset.tab;

    document.querySelectorAll('.vg-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');

    // pausa os outros e toca o vídeo da aba ativa
    heroes.forEach(v => { if (v.dataset.tab !== tab) v.pause(); });
    const h = heroFor(tab);
    if (h) h.play().catch(() => {});
  });
});

// ── fechar ──────────────────────────────────────────────────────
document.getElementById('btn-close').addEventListener('click', closeGallery);

function closeGallery() {
  heroes.forEach(v => v.pause());
  if (window.parent !== window) {
    window.parent.postMessage({ action: 'closeGallery' }, '*');
  } else if (window.history.length > 1) {
    history.back();
  } else {
    window.close();
  }
}
</script>
</body>
</html>
